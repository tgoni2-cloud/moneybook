<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://gmail.googleapis.com https://oauth2.googleapis.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="가계부">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>우리집 가계부</title>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#15171a; --sub:#6b7280; --line:#e6e8eb;
  --accent:#2f6fed; --accent-soft:#e8efff; --exp:#e5484d; --inc:#1a9e5c; --warn:#f5a524;
  --chip:#f0f1f3; --shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);
  --c1:#2f6fed; --c2:#14b8a6; --c3:#f59e0b; --c4:#a855f7; --c5:#ef4444; --c6:#64748b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111214; --card:#1b1d20; --ink:#eef0f2; --sub:#9aa1ab; --line:#2a2d31;
    --accent:#6b9bff; --accent-soft:#1e2a44; --exp:#ff6b6f; --inc:#3ccf8a; --warn:#ffbe4d;
    --chip:#25282c; --shadow:none;
    --c1:#6b9bff; --c2:#2dd4bf; --c3:#fbbf24; --c4:#c084fc; --c5:#f87171; --c6:#94a3b8;
  }
}
:root[data-theme="dark"]{
  --bg:#111214; --card:#1b1d20; --ink:#eef0f2; --sub:#9aa1ab; --line:#2a2d31;
  --accent:#6b9bff; --accent-soft:#1e2a44; --exp:#ff6b6f; --inc:#3ccf8a; --warn:#ffbe4d;
  --chip:#25282c; --shadow:none;
  --c1:#6b9bff; --c2:#2dd4bf; --c3:#fbbf24; --c4:#c084fc; --c5:#f87171; --c6:#94a3b8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}

/* Lock */
#lock{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));z-index:50}
#lock h1{font-size:20px;margin:12px 0 4px}
#lock .lsub{color:var(--sub);font-size:14px;min-height:20px;text-align:center}
.lock-logo{width:64px;height:64px;border-radius:16px}
.dots{display:flex;gap:14px;margin:28px 0 32px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--sub);display:block}
.dots i.on{background:var(--ink);border-color:var(--ink)}
.dots.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:16px 26px}
.pad button{width:76px;height:76px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:28px;font-weight:500}
.pad button:active{background:var(--chip)}
.pad button.ghost{background:none;box-shadow:none;font-size:15px;color:var(--sub)}
.bio-btn{margin-top:22px;color:var(--accent);font-weight:600;font-size:15px;padding:10px 16px}

/* Layout */
#app{max-width:680px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.topbar h2{font-size:24px;margin:0;letter-spacing:-.3px}
.nav-arrows{display:flex;align-items:center;gap:4px}
.nav-arrows button{width:36px;height:36px;border-radius:10px;font-size:18px;color:var(--sub)}
.nav-arrows button:active{background:var(--chip)}
.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:12px}
.label{color:var(--sub);font-size:13px}
.big{font-size:32px;font-weight:700;letter-spacing:-.6px;margin:2px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.kpi{background:var(--chip);border-radius:12px;padding:10px}
.kpi b{display:block;font-size:16px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp{color:var(--exp)} .inc{color:var(--inc)} .muted{color:var(--sub)}
.section-title{font-size:15px;font-weight:700;margin:20px 4px 8px;display:flex;justify-content:space-between;align-items:center}

/* Segmented */
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:2px}
.seg button{padding:6px 11px;border-radius:8px;font-size:13px;color:var(--sub);font-weight:600}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.tools{display:flex;justify-content:space-between;gap:8px;margin:18px 0 8px;flex-wrap:wrap}

/* Progress */
.goal{margin-top:12px}
.goal:first-child{margin-top:0}
.goal .row{font-size:14px}
.bar{height:10px;border-radius:6px;background:var(--chip);overflow:hidden;margin-top:6px;position:relative}
.bar>span{display:block;height:100%;border-radius:6px;background:var(--accent);transition:width .4s}
.bar>span.done{background:var(--inc)}
.goal small{color:var(--sub);font-size:12px}
.pct{font-weight:700}

/* Lists */
.group{background:var(--card);border-radius:16px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.ghead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.ghead .muted{font-weight:500}
.tx{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx .ic{width:34px;height:34px;border-radius:10px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.tx .mid{flex:1;min-width:0}
.tx .t1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t2{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{font-weight:600;white-space:nowrap}
.empty{text-align:center;color:var(--sub);padding:28px 12px;font-size:14px}

/* Charts */
.cols{display:flex;align-items:flex-end;gap:4px;height:150px;margin-top:14px;padding-bottom:2px;border-bottom:1px solid var(--line)}
.colg{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100%;cursor:pointer}
.colg i{display:block;width:42%;border-radius:4px 4px 0 0;min-height:1px}
.colg i.ci{background:var(--inc)} .colg i.ce{background:var(--exp)}
.colg.sel{background:var(--accent-soft);border-radius:6px 6px 0 0}
.xlab{display:flex;gap:4px;margin-top:4px}
.xlab span{flex:1;text-align:center;font-size:11px;color:var(--sub)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--sub);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hb{margin-top:10px}
.hb .row{font-size:14px}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;margin-top:12px;background:var(--chip)}
.stack span{display:block;height:100%}
.grid12{display:grid;grid-template-columns:72px repeat(12,1fr);gap:3px;font-size:11px;align-items:center;margin-top:10px}
.grid12 .h{color:var(--sub);text-align:center}
.grid12 .n{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell{height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;background:var(--chip);color:var(--sub)}
.cell.ok{background:var(--inc);color:#fff}
.cell.mid{background:color-mix(in srgb,var(--warn) 70%,transparent);color:var(--ink)}
.cell.low{background:color-mix(in srgb,var(--exp) 25%,transparent);color:var(--ink)}

/* Settings */
.set-item{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);gap:10px}
.set-item:last-child{border-bottom:0}
.set-item .muted{font-size:13px}
.btn{background:var(--accent);color:#fff;border-radius:12px;padding:11px 16px;font-weight:600;font-size:15px}
.btn.sec{background:var(--chip);color:var(--ink)}
.btn.danger{background:none;color:var(--exp);padding:11px 0}
.btn.block{display:block;width:100%;text-align:center}
.upload{border:2px dashed var(--line);border-radius:16px;padding:22px 16px;text-align:center;cursor:pointer}
.upload:hover{border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.field input,.field select{background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.cardrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.cardrow .full{grid-column:1/-1}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}
.note{font-size:13px;color:var(--sub);line-height:1.55}

/* Fixed costs & header gear */
.gear{width:38px;height:38px;border-radius:11px;color:var(--sub);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.gear svg{width:22px;height:22px}
.gear:active{background:var(--chip)}
.topbar{gap:6px}
.topbar h2{flex:1}
.daybadge{flex-direction:column;line-height:1;background:var(--accent-soft)!important;color:var(--accent)}
.daybadge b{font-size:15px}
.daybadge small{font-size:9px}
button.tx{font:inherit;color:inherit;background:none}
button.tx:active{background:var(--chip)}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:70;padding:16px}
.sheet{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:340px}
.sheet .pw{width:100%;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:24px;letter-spacing:8px;text-align:center}

/* Tabbar */
#tabbar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 88%,transparent);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
#tabbar .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
#tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--sub);font-size:11px;font-weight:600}
#tabbar button svg{width:24px;height:24px}
#tabbar button.on{color:var(--accent)}
#tabbar button.center .pill{width:54px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center}
#tabbar button.center.on .pill{background:var(--accent);color:#fff}
#tabbar button.center:not(.on) .pill{background:var(--chip)}
</style>
</head>
<body>
<div id="lock">
  <img class="lock-logo" src="icon-192.png" alt="">
  <h1 id="lockTitle">우리집 가계부</h1>
  <div class="lsub" id="lockSub">비밀번호 6자리를 입력하세요</div>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="pad" id="pad"></div>
  <button class="bio-btn hidden" id="bioBtn">Face ID로 열기</button>
</div>
<div id="app" class="hidden"></div>
<nav id="tabbar" class="hidden"><div class="in" id="tabs"></div></nav>
<script src="xlsx.mini.min.js"></script>
<script src="zip.min.js"></script>
<script src="app.js"></script>
</body>
</html>
